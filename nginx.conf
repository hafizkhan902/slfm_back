upstream node_backend_cluster {
    least_conn; # Route traffic to worker node with fewest active connections
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 80;
    server_name api.shahlajukfurniture.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.shahlajukfurniture.com;

    ssl_certificate /etc/letsencrypt/live/api.shahlajukfurniture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shahlajukfurniture.com/privkey.pem;

    # High-Performance Gzip Compression
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1000;

    location / {
        proxy_pass http://node_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
